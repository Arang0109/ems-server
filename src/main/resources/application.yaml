spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: ems

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ems}?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:"0000"}

  data:
    redis:
      host: ${DB_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:5000}

  jpa:
    show-sql: true        # 실행되는 SQL문 콘솔에 출력
    hibernate:
      ddl-auto: update    # 테이블 자동 생성 방식 (create, update, validate 등)
    properties:
      hibernate:
        format_sql: true  # SQL문 보기 좋게 정렬

jwt:
  secret: ${JWT_SECRET}
  access-token-validity: ${AT_VALID:3600000}
  refresh-token-validity: ${RT_VALID:25200000}

logging:
  level:
    root: DEBUG