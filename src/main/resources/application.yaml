spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: ems
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  # @Scheduled 실행 풀. 기본값이 1이라 SSE 하트비트가 죽은 소켓에서 블로킹되면
  # 주기 작업 전체가 멈춘다. 여유를 둬 한 구독의 지연이 전파되지 않게 한다.
  task:
    scheduling:
      pool:
        size: 4

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ems}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:"0000"}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:5000}
    mongodb:
      uri: ${MONGO_URI:mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DB:ems}}
      auto-index-creation: true

  jpa:
    show-sql: true        # 실행되는 SQL문 콘솔에 출력
    hibernate:
      ddl-auto: update    # 테이블 자동 생성 방식 (create, update, validate 등)
    properties:
      hibernate:
        format_sql: true  # SQL문 보기 좋게 정렬

# 문서 보관소. 배포환경은 STORAGE_PROVIDER=S3 로 올린다.
# provider가 보관소 구현체를 고른다 — LOCAL이면 LocalFileStorageAdapter, S3면 S3FileStorageAdapter만
# 빈으로 뜬다. 한 환경에 보관소는 하나뿐이라 값을 바꾸면 이전 보관소의 파일은 읽지 못한다.
ems:
  storage:
    provider: ${STORAGE_PROVIDER:LOCAL}
    local-root: ${STORAGE_LOCAL_ROOT:./data/storage}
    s3:
      # provider=S3 인데 비어 있으면 기동이 실패한다. 자격증명은 IAM Role(SDK 기본 체인)에 맡긴다.
      bucket: ${S3_BUCKET:}
      region: ${AWS_REGION:ap-northeast-2}
      # 한 번 정하면 바꾸지 않는다. 바꾸면 이전에 올린 파일을 찾지 못한다.
      key-prefix: ${S3_KEY_PREFIX:documents}
      # MinIO 등 S3 호환 스토리지로 검증할 때만 채운다.
      endpoint: ${S3_ENDPOINT:}
      path-style-access: ${S3_PATH_STYLE:false}

# Refresh Token 쿠키 전송 정책. HTTP로 접속하는 개발 서버에 secure 쿠키를 내려보내면
# 브라우저가 저장하지 않아 재발급이 실패한다. 프론트·API가 같은 오리진(nginx)이라 Lax로 충분하며,
# HTTPS 도메인으로 서비스할 때만 COOKIE_SECURE=true / COOKIE_SAME_SITE=None 으로 올린다.
app:
  cookie:
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}

jwt:
  secret: ${JWT_SECRET}
  access-token-validity: ${AT_VALID:3600000}
  refresh-token-validity: ${RT_VALID:25200000}

# 운영자(PLATFORM_ADMIN) 최초 부트스트랩. 최초 배포 시에만 환경변수로 계정을 주입한다.
platform:
  bootstrap:
    enabled: ${PLATFORM_BOOTSTRAP_ENABLED:false}
    username: ${PLATFORM_ADMIN_USERNAME:}
    password: ${PLATFORM_ADMIN_PASSWORD:}
    name: ${PLATFORM_ADMIN_NAME:운영자}
    email: ${PLATFORM_ADMIN_EMAIL:}
    department: ${PLATFORM_ADMIN_DEPARTMENT:}
    tel: ${PLATFORM_ADMIN_TEL:}
    system-tenant-name: ${PLATFORM_SYSTEM_TENANT_NAME:플랫폼}
    system-tenant-biz-number: ${PLATFORM_SYSTEM_TENANT_BIZ:0000000000}

# 고객사에게 지원하는 측정물질 가이드. 카탈로그가 비어 있으면 물질 선택 자체가 불가능하므로 시드는 기본 활성이다.
pollutant:
  catalog:
    seed-enabled: ${POLLUTANT_CATALOG_SEED_ENABLED:true}

logging:
  level:
    root: INFO